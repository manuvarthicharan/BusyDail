<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Setup — BusyDail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom AI Startup Animations */
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 8s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center px-4 py-10 relative overflow-x-hidden font-sans">

    <div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] bg-blue-600/20 rounded-full blur-[120px] animate-pulse-slow pointer-events-none z-0"></div>
    <div class="fixed bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-purple-600/20 rounded-full blur-[120px] animate-pulse-slow pointer-events-none z-0" style="animation-delay: 2s;"></div>

    <div class="w-full max-w-md relative z-10 w-full">

        <div class="text-center mb-8 flex flex-col items-center">
            <a href="index.html" class="flex items-center gap-3 group inline-flex mb-2">
                <img src="bdlogo.png" alt="BusyDail Icon" class="h-10 sm:h-12 w-auto transition-transform duration-300 group-hover:scale-110 group-hover:rotate-3">
                <img src="bdtext.png" alt="BusyDail" class="h-6 sm:h-7 w-auto opacity-90 group-hover:opacity-100 transition-opacity">
            </a>
            <p class="text-gray-400 mt-2 text-sm sm:text-base">One last step</p>
        </div>

        <div class="bg-gray-900/60 backdrop-blur-xl border border-white/10 rounded-3xl p-6 sm:p-8 shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            <h1 class="text-xl sm:text-2xl font-bold mb-6 text-center">Name your Workspace</h1>

            <div id="error" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-sm backdrop-blur-sm"></div>

            <form id="onboardingForm" class="space-y-4 sm:space-y-5">
                <div>
                    <label class="block text-sm text-gray-400 mb-1.5 ml-1">Business or Team Name</label>
                    <input
                        type="text"
                        id="businessName"
                        placeholder="e.g. Acme Corp"
                        required
                        class="w-full px-4 py-3 bg-black/20 border border-white/10 rounded-xl text-white placeholder-gray-500 text-sm sm:text-base focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                    />
                </div>

                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 hover:shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:-translate-y-0.5 rounded-xl font-semibold transition-all duration-300 mt-2 text-sm sm:text-base"
                >
                    Complete Setup
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase, getUser } from './supabase.js';

        const user = await getUser();
        if (!user) window.location.href = 'login.html';

        document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const businessName = document.getElementById('businessName').value.trim();
            const btn = document.getElementById('submitBtn');
            const error = document.getElementById('error');

            btn.textContent = 'Saving...';
            btn.disabled = true;
            error.classList.add('hidden');

            const { error: dbError } = await supabase
                .from('businesses')
                .insert({
                    name: businessName,
                    email: user.email,
                    auth_user_id: user.id, // Links Google Auth user to business table
                    plan: 'free',
                    calls_used_this_month: 0
                });

            if (dbError) {
                error.textContent = dbError.message;
                error.classList.remove('hidden');
                btn.textContent = 'Complete Setup';
                btn.disabled = false;
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>

</body>
</html>

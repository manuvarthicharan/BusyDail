<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — BusyDail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom AI Startup Animations */
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 8s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center px-4 py-10 relative overflow-x-hidden font-sans">

    <div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] bg-blue-600/20 rounded-full blur-[120px] animate-pulse-slow pointer-events-none z-0"></div>
    <div class="fixed bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-purple-600/20 rounded-full blur-[120px] animate-pulse-slow pointer-events-none z-0" style="animation-delay: 2s;"></div>

    <div class="w-full max-w-md relative z-10 w-full">

        <div class="text-center mb-8 flex flex-col items-center">
            <a href="index.html" class="flex items-center gap-3 group inline-flex mb-2">
                <img src="bdlogo.png" alt="BusyDail Icon" class="h-10 sm:h-12 w-auto transition-transform duration-300 group-hover:scale-110 group-hover:rotate-3">
                <img src="bdtext.png" alt="BusyDail" class="h-6 sm:h-7 w-auto opacity-90 group-hover:opacity-100 transition-opacity">
            </a>
            <p class="text-gray-400 mt-2 text-sm sm:text-base">Welcome back</p>
        </div>

        <div class="bg-gray-900/60 backdrop-blur-xl border border-white/10 rounded-3xl p-6 sm:p-8 shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            <h1 class="text-xl sm:text-2xl font-bold mb-6 text-center">Login to your account</h1>

            <div id="error" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-sm backdrop-blur-sm"></div>

            <button id="googleAuthBtn" type="button" class="w-full mb-6 py-3 px-4 bg-white hover:bg-gray-100 text-gray-900 rounded-xl font-semibold transition-all flex items-center justify-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>

            <div class="flex items-center mb-6">
                <div class="flex-grow h-px bg-white/10"></div>
                <span class="px-4 text-xs text-gray-500 uppercase">Or</span>
                <div class="flex-grow h-px bg-white/10"></div>
            </div>

            <form id="loginForm" class="space-y-4 sm:space-y-5">
                <div>
                    <label class="block text-sm text-gray-400 mb-1.5 ml-1">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@company.com"
                        required
                        class="w-full px-4 py-3 bg-black/20 border border-white/10 rounded-xl text-white placeholder-gray-500 text-sm sm:text-base focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                    />
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5 ml-1 mr-1">
                        <label class="block text-sm text-gray-400">Password</label>
                        <a href="#" class="text-xs text-blue-400 hover:text-blue-300 transition">Forgot password?</a>
                    </div>
                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                        class="w-full px-4 py-3 bg-black/20 border border-white/10 rounded-xl text-white placeholder-gray-500 text-sm sm:text-base focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                    />
                </div>

                <button
                    type="submit"
                    id="loginBtn"
                    class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 hover:shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:-translate-y-0.5 rounded-xl font-semibold transition-all duration-300 mt-2 text-sm sm:text-base"
                >
                    Login
                </button>
            </form>

            <p class="text-center text-gray-400 text-sm mt-6 sm:mt-8">
                Don't have an account?
                <a href="signup.html" class="text-blue-400 hover:text-blue-300 font-medium transition">Sign up free</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        // If already logged in → go to dashboard
        const { data: { user } } = await supabase.auth.getUser();
        if (user) window.location.href = 'dashboard.html';

        // Google Auth Logic
        document.getElementById('googleAuthBtn').addEventListener('click', async () => {
            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/dashboard.html'
                }
            });
            if (error) {
                const errorEl = document.getElementById('error');
                errorEl.textContent = error.message;
                errorEl.classList.remove('hidden');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const error = document.getElementById('error');

            btn.textContent = 'Logging in...';
            btn.disabled = true;
            error.classList.add('hidden');

            const { error: authError } = await supabase.auth.signInWithPassword({ email, password });

            if (authError) {
                error.textContent = authError.message;
                error.classList.remove('hidden');
                btn.textContent = 'Login';
                btn.disabled = false;
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>

</body>
</html>
